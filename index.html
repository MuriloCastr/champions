<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Champions IAPE — Central do Técnico</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#f8fafc}.glass{background:rgba(15,23,42,.78);backdrop-filter:blur(16px);border:1px solid rgba(148,163,184,.12)}.pitch{background:radial-gradient(circle at center,rgba(34,197,94,.2),transparent 55%),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),#123524;background-size:auto,10% 10%,10% 10%;border:2px solid rgba(255,255,255,.35)}.player{touch-action:none;cursor:grab}.player:active{cursor:grabbing}.tab{transition:.2s}.tab.active{background:#fff;color:#0f172a}.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getDatabase,ref,onValue,set,update} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

// COLE A CONFIGURAÇÃO DO SEU PROJETO FIREBASE AQUI.
const firebaseConfig={apiKey:"COLE_AQUI",authDomain:"COLE_AQUI",databaseURL:"COLE_AQUI",projectId:"COLE_AQUI",storageBucket:"COLE_AQUI",messagingSenderId:"COLE_AQUI",appId:"COLE_AQUI"};
let db=null; try{if(firebaseConfig.apiKey!=="COLE_AQUI"){db=getDatabase(initializeApp(firebaseConfig))}}catch(e){console.warn(e)}

const initial={teams:{barcelona:{name:'Barcelona',coach:'Murilo',budget:1000000,players:[]},real:{name:'Real Madrid',coach:'Gabriel',budget:1000000,players:[]},city:{name:'Manchester City',coach:'Henrique',budget:1000000,players:[]},liverpool:{name:'Liverpool',coach:'Karane',budget:1000000,players:[]}},auction:[],plans:{A:[],B:[],C:[],D:[]},myTeam:'barcelona'};
let state=structuredClone(initial), tab='dashboard', plan='A', search='';
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
const save=()=>{if(db)set(ref(db,'champions'),state);else localStorage.setItem('champions-demo',JSON.stringify(state));render()};
if(db) onValue(ref(db,'champions'),s=>{if(s.exists())state=s.val();else set(ref(db,'champions'),state);render()}); else {const x=localStorage.getItem('champions-demo');if(x)state=JSON.parse(x)}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function header(){return `<header class="sticky top-0 z-30 border-b border-white/10 bg-[#070b14]/90 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div><div class="text-xs uppercase tracking-[.3em] text-sky-400 font-bold">IAPE • LEILÃO</div><h1 class="text-xl sm:text-2xl font-black">Champions Central</h1></div><div class="flex items-center gap-2"><span class="hidden sm:inline text-xs text-slate-400">${db?'☁ sincronizado':'⚠ modo local'}</span><button onclick="config()" class="px-3 py-2 rounded-xl glass text-sm">⚙</button></div></div></header>`}
function nav(){return `<nav class="max-w-7xl mx-auto px-4 pt-4"><div class="glass rounded-2xl p-1 flex gap-1 overflow-x-auto"><button class="tab ${tab==='dashboard'?'active':''} px-4 py-2 rounded-xl font-bold whitespace-nowrap" onclick="go('dashboard')">🏠 Painel</button><button class="tab ${tab==='planning'?'active':''} px-4 py-2 rounded-xl font-bold whitespace-nowrap" onclick="go('planning')">🧠 Planejamento</button><button class="tab ${tab==='auction'?'active':''} px-4 py-2 rounded-xl font-bold whitespace-nowrap" onclick="go('auction')">🔨 Leilão ao vivo</button><button class="tab ${tab==='teams'?'active':''} px-4 py-2 rounded-xl font-bold whitespace-nowrap" onclick="go('teams')">👥 Times</button></div></nav>`}
function dashboard(){let me=state.teams.barcelona;return `<main class="max-w-7xl mx-auto px-4 py-6 space-y-5"><section class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 glass rounded-3xl p-6"><div class="flex justify-between items-start"><div><p class="text-slate-400">Seu time</p><h2 class="text-3xl font-black">🔵🔴 Barcelona</h2><p class="text-slate-400 mt-1">Técnico: Murilo</p></div><span class="px-3 py-1 rounded-full bg-emerald-400/10 text-emerald-300 text-xs font-bold">${me.players?.length||0}/7 contratadas</span></div><div class="mt-7"><p class="text-slate-400 text-sm">Caixa disponível</p><p class="text-4xl font-black text-emerald-300">${money(me.budget)}</p><div class="h-2 bg-slate-800 rounded-full mt-3"><div class="h-2 bg-emerald-400 rounded-full" style="width:${Math.min(100,(me.budget/1000000)*100)}%"></div></div></div></div><div class="glass rounded-3xl p-6"><p class="text-slate-400">Status do leilão</p><p class="text-2xl font-black mt-1">${state.auction.length} jogadoras</p><p class="text-slate-400 text-sm mt-2">já registradas no histórico</p><button onclick="go('auction')" class="mt-6 w-full rounded-xl bg-white text-slate-950 font-black py-3">Abrir leilão →</button></div></section><section><h3 class="text-lg font-black mb-3">Resumo dos adversários</h3><div class="grid sm:grid-cols-3 gap-3">${['real','city','liverpool'].map(k=>{let t=state.teams[k];return `<div class="glass rounded-2xl p-4"><div class="font-bold">${t.name}</div><div class="text-sm text-slate-400">${t.coach}</div><div class="text-xl font-black mt-3">${money(t.budget)}</div><div class="text-xs text-slate-500">${t.players?.length||0}/7 vagas</div></div>`}).join('')}</div></section></main>`}
function planning(){return `<main class="max-w-7xl mx-auto px-4 py-6"><div class="flex flex-col lg:flex-row gap-5"><section class="lg:w-1/2"><div class="flex items-center justify-between mb-3"><div><h2 class="text-2xl font-black">Planos de guerra</h2><p class="text-slate-400 text-sm">Monte quatro escalações antes do leilão.</p></div><div class="flex gap-1">${['A','B','C','D'].map(x=>`<button onclick="plan='${x}';render()" class="px-3 py-2 rounded-xl ${plan===x?'bg-white text-slate-950':'glass'} font-black">${x}</button>`).join('')}</div></div><div class="glass rounded-2xl p-4"><div class="flex gap-2"><input id="pn" class="flex-1 bg-slate-900 rounded-xl px-3 py-3 outline-none" placeholder="Nome da jogadora" onkeydown="if(event.key==='Enter')addPlan()"><select id="pp" class="bg-slate-900 rounded-xl px-3"><option>Goleira</option><option>Linha</option><option>Reserva</option></select><button onclick="addPlan()" class="bg-white text-slate-950 rounded-xl px-4 font-black">Adicionar</button></div></div><div class="mt-3 space-y-2">${(state.plans[plan]||[]).map((p,i)=>`<div class="glass rounded-xl p-3 flex justify-between"><span><b>${p.name}</b><span class="text-xs text-slate-500 ml-2">${p.pos}</span></span><button onclick="state.plans['${plan}'].splice(${i},1);save()" class="text-rose-300">×</button></div>`).join('')}</div></section><section><h2 class="text-2xl font-black mb-3">Campo tático • Plano ${plan}</h2><div class="pitch rounded-3xl aspect-[4/5] relative overflow-hidden p-5"><div class="absolute inset-x-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 rounded-full border border-white/30"></div><div class="absolute inset-x-1/2 top-0 -translate-x-1/2 w-36 h-20 border border-white/30 border-t-0"></div><div class="absolute inset-x-1/2 bottom-0 -translate-x-1/2 w-36 h-20 border border-white/30 border-b-0"></div>${(state.plans[plan]||[]).slice(0,7).map((p,i)=>`<div class="absolute player -translate-x-1/2" style="left:${[50,22,42,58,78,35,65][i]}%;top:${[88,68,56,56,68,30,30][i]}%"><div class="w-12 h-12 rounded-full bg-white text-slate-950 flex items-center justify-center font-black shadow-lg">${i+1}</div><div class="text-[10px] text-center mt-1 font-bold bg-black/50 rounded px-1">${esc(p.name)}</div></div>`).join('')}</div></section></div></main>`}
function auction(){let me=state.teams.barcelona;return `<main class="max-w-7xl mx-auto px-4 py-6 space-y-4"><section class="grid md:grid-cols-3 gap-3"><div class="glass rounded-2xl p-4"><span class="text-slate-400 text-sm">Meu caixa</span><div class="text-2xl font-black text-emerald-300">${money(me.budget)}</div></div><div class="glass rounded-2xl p-4"><span class="text-slate-400 text-sm">Minhas vagas</span><div class="text-2xl font-black">${7-(me.players?.length||0)} <span class="text-sm text-slate-500">restantes</span></div></div><div class="glass rounded-2xl p-4"><span class="text-slate-400 text-sm">Lance atual</span><div class="text-2xl font-black">${state.currentBid?money(state.currentBid.amount):'—'}</div></div></section><section class="grid lg:grid-cols-5 gap-4"><div class="lg:col-span-3 glass rounded-3xl p-5"><h2 class="text-2xl font-black">🔨 Registrar venda</h2><p class="text-sm text-slate-400 mb-4">Use isto como painel durante o leilão.</p><div class="grid sm:grid-cols-2 gap-3"><input id="an" class="bg-slate-900 rounded-xl px-3 py-3" placeholder="Nome da jogadora"><input id="ab" type="number" class="bg-slate-900 rounded-xl px-3 py-3" placeholder="Valor da venda"><select id="at" class="bg-slate-900 rounded-xl px-3 py-3 sm:col-span-2"><option value="barcelona">Barcelona — Murilo</option><option value="real">Real Madrid — Gabriel</option><option value="city">Manchester City — Henrique</option><option value="liverpool">Liverpool — Karane</option></select><select id="ap" class="bg-slate-900 rounded-xl px-3 py-3"><option>Goleira</option><option>Linha</option><option>Reserva</option></select><button onclick="sell()" class="bg-white text-slate-950 rounded-xl py-3 font-black">Confirmar venda</button></div></div><div class="lg:col-span-2 glass rounded-3xl p-5"><h3 class="font-black text-lg">Histórico</h3><div class="mt-3 space-y-2 max-h-72 overflow-auto">${state.auction.slice().reverse().map(x=>`<div class="rounded-xl bg-slate-900/70 p-3 flex justify-between gap-3"><div><b>${esc(x.player)}</b><div class="text-xs text-slate-500">${state.teams[x.team].name} • ${x.pos}</div></div><b>${money(x.amount)}</b></div>`).join('')||'<p class="text-slate-500 text-sm">Nenhuma venda registrada.</p>'}</div></div></section></main>`}
function teams(){return `<main class="max-w-7xl mx-auto px-4 py-6"><div class="flex items-center justify-between mb-4"><div><h2 class="text-2xl font-black">Todos os times</h2><p class="text-slate-400 text-sm">Informação rápida para tomar decisões.</p></div><input class="bg-slate-900 rounded-xl px-3 py-2" placeholder="Buscar jogadora" oninput="search=this.value.toLowerCase();render()"></div><div class="grid md:grid-cols-2 gap-4">${Object.entries(state.teams).map(([k,t])=>`<section class="glass rounded-3xl p-5 ${k==='barcelona'?'ring-1 ring-sky-400/30':''}"><div class="flex justify-between"><div><h3 class="text-xl font-black">${t.name}</h3><p class="text-slate-400">Técnico: ${t.coach}</p></div><div class="text-right"><b class="text-emerald-300">${money(t.budget)}</b><div class="text-xs text-slate-500">${t.players?.length||0}/7</div></div></div><div class="mt-4 space-y-1">${(t.players||[]).filter(p=>!search||p.name.toLowerCase().includes(search)).map(p=>`<div class="bg-slate-900/60 rounded-xl px-3 py-2 flex justify-between text-sm"><span>${esc(p.name)}</span><span class="text-slate-500">${p.pos} • ${money(p.amount)}</span></div>`).join('')||'<div class="text-sm text-slate-500">Nenhuma jogadora.</div>'}</div></section>`).join('')}</div></main>`}
function config(){alert('Para sincronização entre todos os dispositivos, configure o Firebase no topo do index.html. Veja README.md no repositório.\n\nSem Firebase, o sistema usa armazenamento local apenas neste navegador.')} 
window.go=x=>{tab=x;render()};window.plan=plan;window.addPlan=()=>{let n=document.getElementById('pn').value.trim(),p=document.getElementById('pp').value;if(!n)return;state.plans[plan]=state.plans[plan]||[];if(state.plans[plan].length>=7)return alert('Máximo de 7 jogadoras por plano.');state.plans[plan].push({name:n,pos:p});save()};window.sell=()=>{let n=document.getElementById('an').value.trim(),a=Number(document.getElementById('ab').value),t=document.getElementById('at').value,p=document.getElementById('ap').value;if(!n||!a)return alert('Informe jogadora e valor.');if(state.teams[t].players.length>=7)return alert('Esse time já tem 7 jogadoras.');if(state.teams[t].budget<a)return alert('Esse time não tem caixa suficiente.');state.teams[t].budget-=a;state.teams[t].players.push({name:n,amount:a,pos:p});state.auction.push({player:n,amount:a,team:t,pos:p,time:new Date().toISOString()});save()};
function render(){document.getElementById('app').innerHTML=header()+nav()+(tab==='dashboard'?dashboard():tab==='planning'?planning():tab==='auction'?auction():teams())}render();
</script></body></html>
