<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Champions IAPE — Central do Técnico</title><style>
:root{--bg:#070b12;--card:#101823;--card2:#0c141e;--line:#263244;--text:#f7f9fc;--muted:#8d9aad;--green:#34d399;--blue:#60a5fa;--red:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#182844,transparent 35%),radial-gradient(circle at 100% 0,#26192c,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}.brand small{color:var(--blue);font-weight:900;letter-spacing:.22em}.brand h1{margin:4px 0;font-size:26px}.pill{padding:8px 12px;border:1px solid var(--line);background:#111a27;border-radius:999px;color:var(--muted);font-size:12px}.nav{display:flex;gap:5px;overflow:auto;background:#101722dd;border:1px solid var(--line);padding:5px;border-radius:15px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 15px;border-radius:10px;font-weight:900;white-space:nowrap}.nav button.on{background:#fff;color:#07101a}.page{padding:22px 0}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.panel{background:linear-gradient(145deg,#121b29,#0d141f);border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:0 15px 45px #0005}.hero{min-height:205px;display:flex;flex-direction:column;justify-content:space-between}.muted,.eyebrow{color:var(--muted)}.eyebrow{font-size:12px}.big{font-size:37px;font-weight:950;letter-spacing:-.04em}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.btn{background:#fff;color:#07101a;border:0;padding:11px 15px;border-radius:11px;font-weight:900}.btn.dark{background:#182332;color:#fff;border:1px solid var(--line)}.btn.red{background:#381923;color:#fecdd3}.bar{height:7px;background:#202b3a;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--green)}.teamhead,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.teamname{font-size:18px;font-weight:900}.money{font-size:20px;font-weight:900}.row{background:#0c1420;border:1px solid #202b3a;padding:11px 12px;border-radius:12px}.list{display:flex;flex-direction:column;gap:8px}.row small{color:var(--muted)}.form{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:9px}.input,.select{width:100%;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;outline:0}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{padding:9px 14px;border-radius:10px;background:#101925;color:var(--muted);border:1px solid var(--line);font-weight:900}.tabs button.on{background:#fff;color:#07101a}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:15px}.pitch{position:relative;min-height:650px;border:2px solid #ffffff66;border-radius:22px;overflow:hidden;background:linear-gradient(90deg,transparent 49.7%,#ffffff30 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#ffffff30 50%,transparent 50.3%),#123a29}.pitch:before{content:"";position:absolute;inset:10%;border:2px solid #ffffff35}.circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border:2px solid #ffffff35;border-radius:50%}.slot{position:absolute;transform:translate(-50%,-50%);width:78px;text-align:center}.ball{width:50px;height:50px;margin:auto;display:grid;place-items:center;background:#fff;color:#07101a;border-radius:50%;font-weight:950;box-shadow:0 7px 20px #0008}.slot span{display:block;margin-top:5px;background:#06110ddd;border-radius:7px;padding:3px;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slotpick{background:#0c1420;border:1px solid var(--line);border-radius:12px;padding:12px}.stat{background:#0c1420;border:1px solid var(--line);border-radius:15px;padding:15px}.stat label{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:23px;margin-top:5px}.auctiontop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.notice{padding:12px;border:1px solid var(--line);background:#151e2b;border-radius:12px;color:#cbd5e1;font-size:13px}.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.history{max-height:500px;overflow:auto}@media(max-width:1000px){.g4,.auctiontop{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:650px){.app{padding:12px}.pill{display:none}.g2,.g3,.g4,.auctiontop{grid-template-columns:1fr}.form{grid-template-columns:1fr}.pitch{min-height:500px}.panel{padding:15px}}
</style></head><body><div id="app" class="app"></div><script>
const KEY='champions-iape';const API='';const initial={teams:{barcelona:{name:'Barcelona',coach:'Murilo',budget:1000000,players:[]},real:{name:'Real Madrid',coach:'Gabriel',budget:1000000,players:[]},city:{name:'Manchester City',coach:'Henrique',budget:1000000,players:[]},liverpool:{name:'Liverpool',coach:'Karane',budget:1000000,players:[]}},plans:{A:{},B:{},C:{},D:{}},auction:[],updated:null};let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(initial),page='dashboard',plan='A',search='';const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function save(){state.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));render();if(API)try{await fetch(API,{method:'POST',body:JSON.stringify({action:'save',data:state})})}catch(e){}}async function load(){if(!API)return;try{let r=await fetch(API+'?action=load'),x=await r.json();if(x.data){state=x.data;localStorage.setItem(KEY,JSON.stringify(state));render()}}catch(e){}}
function go(x){page=x;render()}function rows(a){return a.length?'<div class="list">'+a.map((p,i)=>`<div class="row"><div><b>${i+1}. ${esc(p.name)}</b><small> • ${p.pos}</small></div><b>${money(p.amount)}</b></div>`).join('')+'</div>':'<div class="empty">Nenhuma jogadora.</div>'}function shell(c){return `<header class="top"><div class="brand"><small>CHAMPIONS IAPE</small><h1>Central do Técnico</h1></div><span class="pill">🔒 Painel do técnico • ${API?'☁ sincronizado':'💾 salvo localmente'}</span></header><nav class="nav">${[['dashboard','🏠 Visão geral'],['planning','🧠 Planejamento'],['auction','🔨 Leilão ao vivo'],['teams','👥 Times'],['history','📜 Histórico']].map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav>${c}`}function teamCard(k){let t=state.teams[k];return `<div class="panel"><div class="teamhead"><div><div class="teamname">${t.name}</div><small class="muted">Técnico: ${t.coach}</small></div><b class="green">${money(t.budget)}</b></div><div class="bar"><i style="width:${t.budget/10000}%"></i></div><small class="muted">${t.players.length}/7 • ${7-t.players.length} vagas</small></div>`}
function dashboard(){let m=state.teams.barcelona;return `<main class="page"><div class="grid g2"><section class="panel hero"><div><div class="eyebrow">SEU TIME • TÉCNICO MURILO</div><h2 style="font-size:32px;margin:7px 0">🔵🔴 Barcelona</h2><span class="muted">Seu centro de comando.</span></div><div><div class="eyebrow">CAIXA DISPONÍVEL</div><div class="big green">${money(m.budget)}</div><div class="bar"><i style="width:${m.budget/10000}%"></i></div></div></section><section class="panel hero"><div><div class="eyebrow">ELENCO</div><div class="big">${m.players.length}<span class="muted" style="font-size:17px"> / 7</span></div><span class="muted">${7-m.players.length} vagas restantes</span></div><button class="btn" onclick="go('auction')">Abrir leilão →</button></section></div><div class="title" style="margin:22px 0 14px"><div><h2>Radar dos adversários</h2><p class="muted">Caixa, vagas e contratações em uma tela.</p></div></div><div class="grid g3">${['real','city','liverpool'].map(teamCard).join('')}</div><div class="title" style="margin:22px 0 14px"><div><h2>Meu elenco</h2><p class="muted">Barcelona • ${m.players.length}/7</p></div><button class="btn dark" onclick="go('planning')">Planejar</button></div>${rows(m.players)}</main>`}
const slots=[['Goleira',50,90],['Linha 1',22,68],['Linha 2',42,61],['Linha 3',58,61],['Linha 4',78,68],['Linha 5',35,36],['Reserva',65,36]];function planning(){let p=state.plans[plan]||{};return `<main class="page"><div class="title"><div><h2>Planejamento pré-leilão</h2><p class="muted">Monte os planos A, B, C e D antes de começar.</p></div></div><div class="tabs">${['A','B','C','D'].map(x=>`<button class="${plan===x?'on':''}" onclick="plan='${x}';render()">Plano ${x}</button>`).join('')}</div><div class="layout"><section class="panel"><h3>Plano ${plan}</h3><div class="form"><input class="input" id="pn" placeholder="Nome da jogadora"><select class="select" id="ps">${slots.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('')}</select><button class="btn" onclick="addPlan()">Adicionar</button></div><p class="muted" style="font-size:12px">Você pode preencher ou trocar qualquer vaga diretamente.</p><div class="list">${slots.map((s,i)=>`<div class="slotpick"><b>${s[0]}</b><div style="display:flex;gap:7px"><input class="input" value="${esc(p[i]||'')}" placeholder="Vaga vazia" oninput="state.plans[plan][${i}]=this.value;localStorage.setItem(KEY,JSON.stringify(state));draw()"><button class="btn red" onclick="delete state.plans[plan][${i}];save()">×</button></div></div>`).join('')}</div></section><section><div class="pitch"><div class="circle"></div>${slots.map((s,i)=>`<div class="slot" style="left:${s[1]}%;top:${s[2]}%"><div class="ball">${i===0?'GK':i===6?'R':i}</div><span id="n${i}">${esc(p[i]||s[0])}</span></div>`).join('')}</div></section></div></main>`}function addPlan(){let n=$('pn').value.trim(),i=+$('ps').value;if(!n)return;state.plans[plan]=state.plans[plan]||{};state.plans[plan][i]=n;save()}function draw(){slots.forEach((s,i)=>{let e=$('n'+i);if(e)e.textContent=state.plans[plan]?.[i]||s[0]})}
function auction(){let m=state.teams.barcelona;return `<main class="page"><div class="title"><div><h2>Leilão ao vivo</h2><p class="muted">Você registra as vendas; os outros técnicos não usam o painel.</p></div><button class="btn red" onclick="undo()">↶ Desfazer última</button></div><div class="auctiontop"><div class="stat"><label>Seu caixa</label><b class="green">${money(m.budget)}</b></div><div class="stat"><label>Seu elenco</label><b>${m.players.length}/7</b></div><div class="stat"><label>Vendas registradas</label><b>${state.auction.length}</b></div><div class="stat"><label>Última venda</label><b>${state.auction.length?money(state.auction.at(-1).amount):'—'}</b></div></div><div class="grid g2" style="margin-top:15px"><section class="panel"><h3>🔨 Registrar venda</h3><div class="form"><input class="input" id="an" placeholder="Nome da jogadora"><input class="input" id="ab" type="number" placeholder="Valor"><select class="select" id="at">${Object.entries(state.teams).map(([k,t])=>`<option value="${k}">${t.name} — ${t.coach}</option>`).join('')}</select><select class="select" id="ap"><option>Goleira</option><option>Linha</option><option>Reserva</option></select></div><button class="btn" style="margin-top:9px;width:100%" onclick="sell()">✓ Confirmar venda</button><div class="notice" style="margin-top:12px">O sistema valida automaticamente o caixa e o limite de 1 goleira + 5 de linha + 1 reserva.</div></section><section class="panel"><h3>Caixa dos quatro times</h3><div class="list">${Object.entries(state.teams).map(([k,t])=>`<div class="row"><div><b>${t.name}</b><small> • ${t.coach}</small></div><div><b class="${k==='barcelona'?'green':''}">${money(t.budget)}</b><small>${t.players.length}/7</small></div></div>`).join('')}</div></section></div><div class="title" style="margin:22px 0 14px"><h2>Últimas vendas</h2></div><section class="panel history">${state.auction.length?state.auction.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.player)}</b><small> • ${state.teams[x.team].name} • ${x.pos}</small></div><b>${money(x.amount)}</b></div>`).join(''):'<div class="empty">Nenhuma venda registrada.</div>'}</section></main>`}function sell(){let n=$('an').value.trim(),a=+$('ab').value,t=$('at').value,pos=$('ap').value;if(!n||a<=0)return alert('Informe jogadora e valor.');let x=state.teams[t];if(x.players.length>=7)return alert('Esse time já completou as 7 vagas.');if(x.budget<a)return alert('Esse time não tem caixa suficiente.');if(pos==='Goleira'&&x.players.some(p=>p.pos===pos))return alert('Esse time já tem goleira.');if(pos==='Reserva'&&x.players.some(p=>p.pos===pos))return alert('Esse time já tem reserva.');if(pos==='Linha'&&x.players.filter(p=>p.pos===pos).length>=5)return alert('Esse time já tem 5 jogadoras de linha.');x.budget-=a;x.players.push({name:n,amount:a,pos});state.auction.push({player:n,amount:a,team:t,pos,time:new Date().toISOString()});save()}function undo(){let z=state.auction.pop();if(!z)return;let t=state.teams[z.team];t.budget+=z.amount;let i=t.players.findIndex(p=>p.name===z.player&&p.amount===z.amount);if(i>=0)t.players.splice(i,1);save()}
function teams(){return `<main class="page"><div class="title"><div><h2>Times</h2><p class="muted">Área de consulta. Você administra tudo.</p></div><input class="input" style="max-width:260px" placeholder="Buscar jogadora" value="${esc(search)}" oninput="search=this.value.toLowerCase();render()"></div><div class="grid g2">${Object.entries(state.teams).map(([k,t])=>`<section class="panel"><div class="teamhead"><div><div class="teamname">${t.name}</div><small class="muted">${t.coach}</small></div><b class="green">${money(t.budget)}</b></div><p class="muted">${t.players.length}/7 • ${7-t.players.length} vagas</p>${rows(t.players.filter(p=>!search||p.name.toLowerCase().includes(search)))}</section>`).join('')}</div></main>`}function history(){return `<main class="page"><div class="title"><div><h2>Histórico completo</h2><p class="muted">Tudo que já foi vendido no leilão.</p></div></div><section class="panel">${state.auction.length?'<div class="list">'+state.auction.map((x,i)=>`<div class="row"><div><b>#${i+1} • ${esc(x.player)}</b><small> • ${state.teams[x.team].name} • ${x.pos}</small></div><b>${money(x.amount)}</b></div>`).join('')+'</div>':'<div class="empty">Nenhuma venda registrada.</div>'}</section></main>`}
function render(){let c=page==='dashboard'?dashboard():page==='planning'?planning():page==='auction'?auction():page==='teams'?teams():history();$('app').innerHTML=shell(c)}render();load();</script></body></html>
